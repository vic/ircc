name: Build & Test
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt, go mod tidy and go vet make no change and report nothing
        run: |
          set -x
          go fmt ./...
          go mod tidy
          git diff --exit-code
          go vet ./...
  test:
    # Linux only: ircc reads /proc and SO_PEERCRED.
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race -count=1 ./...
